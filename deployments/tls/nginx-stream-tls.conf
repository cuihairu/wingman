# Wingman agent TCP 链路 TLS 终结（agent-token-auth-design.md §6.3 形态 A）
#
# agent ⇄ Go server 的帧协议是自定义裸 TCP（16B 头 + JSON，端口 8888），
# 不是 HTTP——必须走 stream{} 四层透传，不能套 http{} 反代。
# TLS 在本层终结；明文帧只存在于本容器与 server 容器之间的内网段。
# 边界（agent 不校验证书）：防被动嗅探，不防主动 MITM；token 侧已有
# challenge-response HMAC 化兜底，详见 deployments/tls/README.md。

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {}

stream {
    upstream wingman_agent {
        # 演示栈（deployments/docker/）内 server 容器名；独立部署改这里
        server wingman-server:8888;
    }

    server {
        listen 9443 ssl;

        ssl_certificate     /etc/nginx/certs/agent-tls.crt;
        ssl_certificate_key /etc/nginx/certs/agent-tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_connect_timeout 5s;
        # 不先于协议层断链：agent 心跳 30s，但中间层空闲超时应远大于
        # 心跳间隔，长驻脚本连接不因本层空闲被掐
        proxy_timeout 2h;
        proxy_pass wingman_agent;
    }
}

# 容器内本地健康探测端点（healthcheck 用；未对宿主/内网暴露）
http {
    server {
        listen 127.0.0.1:8085;
        location = /healthz { return 200 "ok\n"; }
    }
}
