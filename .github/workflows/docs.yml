name: Docs

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
  workflow_dispatch:

env:
  ACTIONS_NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ env.ACTIONS_NODE_VERSION }}

    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.0
      with:
        version: 11.28.8

    - name: Install dependencies
      working-directory: docs
      run: pnpm install

    # vitepress 对 md→Vue 插值泄漏（双花括号漏进 template）exit 0 不报错，
    # 2026-11-21 审计页截断即此盲区。秒级静态守卫在 build 前拦截。
    - name: Lint docs
      working-directory: docs
      run: |
        node tests/md-vue-interpolation.test.mjs
        node tests/lang-pick.test.mjs

    - name: Build docs
      working-directory: docs
      run: pnpm docs:build

    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.2
      with:
        name: docs-dist
        path: docs/.vitepress/dist
