name: Build Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g. v0.2.0 or 2026.06.07-nightly-abc1234)'
        required: true
        type: string
      version_suffix:
        description: 'Version suffix for CMake (e.g. 2026.06.07-nightly, empty for releases)'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'GitHub release tag to upload artifacts to'
        required: true
        type: string
      ref:
        description: 'Git ref (tag/branch/SHA) to checkout; empty falls back to github.ref'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  packages: write
  contents: write

env:
  ACTIONS_NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg/archives
  USERNAME: ${{ github.repository_owner }}
  VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Cache vcpkg binaries
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Setup vcpkg
        run: ./build-scripts/ci/setup-vcpkg.ps1

      - name: Add NuGet sources (GitHub Packages)
        run: |
          $patToken = "${{ secrets.VCPKG_PAT_TOKEN }}"
          if ([string]::IsNullOrEmpty($patToken)) {
            Write-Host "VCPKG_PAT_TOKEN not found, using GITHUB_TOKEN (may have limited permissions)"
            $patToken = "${{ github.token }}"
          }

          .\vcpkg\vcpkg fetch nuget | ForEach-Object { & $_ sources add `
            -Source "${{ env.FEED_URL }}" `
            -StorePasswordInClearText `
            -Name "GitHubPackages" `
            -UserName "${{ env.USERNAME }}" `
            -Password $patToken }

          .\vcpkg\vcpkg fetch nuget | ForEach-Object { & $_ setapikey $patToken -Source "${{ env.FEED_URL }}" }

      - name: Prepare vcpkg cache
        run: New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

      - name: Configure CMake
        run: >
          ./build-scripts/ci/configure-windows.ps1
          -BuildDir build
          -Config Release
          -VersionSuffix "${{ inputs.version_suffix }}"

      - name: Build C++ Runtime
        run: cmake --build build --config Release --parallel

      # ====== Go Orchestrator Server ======
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: orchestrator/server/go.sum

      - name: Build Go Server
        working-directory: orchestrator/server
        run: go build -o ../../build/orchestrator-server.exe .

      # ====== Dashboard Frontend ======
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.ACTIONS_NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - name: Build Dashboard
        working-directory: orchestrator/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # ====== Tauri GUI ======
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/gui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/gui/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri GUI
        working-directory: apps/gui
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build

      # ====== Package ======
      - name: Package build
        run: |
          $version = "${{ inputs.version }}"
          $distDir = "dist-wingman-$version"
          New-Item -ItemType Directory -Force -Path "$distDir" | Out-Null

          # C++ Runtime
          Copy-Item "build\apps\runtime\Release\wingman-runtime.exe" -Destination "$distDir\wingman.exe"

          # Go Orchestrator Server
          if (Test-Path "build\orchestrator-server.exe") {
            Copy-Item "build\orchestrator-server.exe" -Destination "$distDir\orchestrator-server.exe"
          }

          # Dashboard (built web assets)
          if (Test-Path "orchestrator\dashboard\dist") {
            New-Item -ItemType Directory -Force -Path "$distDir\dashboard" | Out-Null
            Copy-Item "orchestrator\dashboard\dist\*" -Destination "$distDir\dashboard\" -Recurse
          }

          # Tauri GUI installer
          $nsisDir = "apps\gui\src-tauri\target\release\bundle\nsis"
          if (Test-Path $nsisDir) {
            $installer = Get-ChildItem "$nsisDir\*.exe" | Select-Object -First 1
            if ($installer) {
              Copy-Item $installer.FullName -Destination "$distDir\$($installer.Name)"
            }
          }

          # Scripts
          if (Test-Path "scripts") {
            Copy-Item "scripts" -Destination "$distDir\" -Recurse
          }

          # Config examples
          if (Test-Path "apps\runtime\config") {
            New-Item -ItemType Directory -Force -Path "$distDir\config" | Out-Null
            Copy-Item "apps\runtime\config\*" -Destination "$distDir\config\" -Recurse
          }

          # Version info
          @"
          Wingman $version
          Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          Contents:
          - wingman.exe            : C++ Runtime (screen capture, input, scripting)
          - orchestrator-server.exe: Go Orchestrator Server
          - dashboard/             : Web Dashboard (static files)
          - Wingman_*_x64-setup.exe: Tauri GUI Installer
          - scripts/               : Example scripts
          - config/                : Configuration examples
          "@ | Out-File -FilePath "$distDir\VERSION.txt" -Encoding UTF8

          Compress-Archive -Path "$distDir\*" -DestinationPath "wingman-${version}-windows-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wingman-${{ inputs.version }}-windows-x64
          path: wingman-${{ inputs.version }}-windows-x64.zip
          retention-days: 30
          overwrite: true

      # Release 上传由末尾 publish-assets job 统一顺序执行（重试 + 大小校验，
      # 消除三平台并发上传的竞态与单次网络抖动敏感）

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: "clear"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache mono-complete
          sudo apt-get install -y libx11-dev libxrandr-dev libxext-dev libxtst-dev libxt-dev libxinerama-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup vcpkg
        run: bash ./build-scripts/ci/setup-vcpkg.sh

      - name: Prepare vcpkg cache
        run: mkdir -p "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

      - name: Configure CMake
        run: >
          bash ./build-scripts/ci/configure-unix.sh
          "x64-linux" "Ninja" "build" "Release" "${{ inputs.version_suffix }}"

      - name: Build C++ Runtime
        run: cmake --build build --config Release --parallel

      # ====== Go Orchestrator Server ======
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: orchestrator/server/go.sum

      - name: Build Go Server
        working-directory: orchestrator/server
        run: go build -o ../../build/orchestrator-server .

      # ====== Dashboard Frontend ======
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.ACTIONS_NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - name: Build Dashboard
        working-directory: orchestrator/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # ====== Tauri GUI ======
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/gui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/gui/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri GUI
        working-directory: apps/gui
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build

      # ====== Package ======
      - name: Package
        run: |
          version="${{ inputs.version }}"
          distDir="dist-wingman-$version"
          mkdir -p "$distDir"

          cp build/apps/runtime/wingman-runtime "$distDir/wingman" || true
          cp build/orchestrator-server "$distDir/orchestrator-server" || true

          # Dashboard
          if [ -d "orchestrator/dashboard/dist" ]; then
            mkdir -p "$distDir/dashboard"
            cp -r orchestrator/dashboard/dist/* "$distDir/dashboard/"
          fi

          # Tauri GUI bundle (AppImage/deb)
          tauriBundleDir="apps/gui/src-tauri/target/release/bundle"
          if [ -d "$tauriBundleDir" ]; then
            find "$tauriBundleDir" -name "*.AppImage" -exec cp {} "$distDir/" \;
            find "$tauriBundleDir" -name "*.deb" -exec cp {} "$distDir/" \;
          fi

          [ -d scripts ] && cp -r scripts "$distDir/"
          [ -d apps/runtime/config ] && mkdir -p "$distDir/config" && cp -r apps/runtime/config/* "$distDir/config/"

          cat > "$distDir/VERSION.txt" << EOF
          Wingman $version
          Build Date: $(date)
          Commit: ${{ github.sha }}
          Platform: Linux x64
          EOF

          tar czf "wingman-${version}-linux-x64.tar.gz" -C "$distDir" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wingman-${{ inputs.version }}-linux-x64
          path: wingman-${{ inputs.version }}-linux-x64.tar.gz
          retention-days: 30
          overwrite: true

  build-macos:
    name: macOS x64
    runs-on: macos-15-intel
    env:
      VCPKG_BINARY_SOURCES: "clear"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja mono

      - name: Setup vcpkg
        run: bash ./build-scripts/ci/setup-vcpkg.sh

      - name: Prepare vcpkg cache
        run: mkdir -p "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

      - name: Configure CMake
        run: >
          bash ./build-scripts/ci/configure-unix.sh
          "x64-osx" "Ninja" "build" "Release" "${{ inputs.version_suffix }}"

      - name: Build C++ Runtime
        run: cmake --build build --config Release --parallel

      # ====== Go Orchestrator Server ======
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: orchestrator/server/go.sum

      - name: Build Go Server
        working-directory: orchestrator/server
        run: go build -o ../../build/orchestrator-server .

      # ====== Dashboard Frontend ======
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.ACTIONS_NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - name: Build Dashboard
        working-directory: orchestrator/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # ====== Tauri GUI ======
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/gui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/gui/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri GUI
        working-directory: apps/gui
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build

      # ====== Package ======
      - name: Package
        run: |
          version="${{ inputs.version }}"
          distDir="dist-wingman-$version"
          mkdir -p "$distDir"

          cp build/apps/runtime/wingman-runtime "$distDir/wingman" || true
          cp build/orchestrator-server "$distDir/orchestrator-server" || true

          # Dashboard
          if [ -d "orchestrator/dashboard/dist" ]; then
            mkdir -p "$distDir/dashboard"
            cp -r orchestrator/dashboard/dist/* "$distDir/dashboard/"
          fi

          # Tauri GUI bundle (dmg/app)
          tauriBundleDir="apps/gui/src-tauri/target/release/bundle"
          if [ -d "$tauriBundleDir" ]; then
            find "$tauriBundleDir" -name "*.dmg" -exec cp {} "$distDir/" \;
            find "$tauriBundleDir" -name "*.app" -exec cp -r {} "$distDir/" \;
          fi

          [ -d scripts ] && cp -r scripts "$distDir/"
          [ -d apps/runtime/config ] && mkdir -p "$distDir/config" && cp -r apps/runtime/config/* "$distDir/config/"

          cat > "$distDir/VERSION.txt" << EOF
          Wingman $version
          Build Date: $(date)
          Commit: ${{ github.sha }}
          Platform: macOS x64
          EOF

          tar czf "wingman-${version}-macos-x64.tar.gz" -C "$distDir" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wingman-${{ inputs.version }}-macos-x64
          path: wingman-${{ inputs.version }}-macos-x64.tar.gz
          retention-days: 30
          overwrite: true

  # Android Agent（arm64，docs/android-agent-design.md §6）：Kotlin 壳 +
  # NDK C++ 核心（vcpkg arm64-android 依赖，桌面同源）。debug APK 自动
  # debug 签名，无需发布证书；iOS 因无签名证书不提供（docs/mobile-support-feasibility.md）。
  build-android:
    name: Android arm64
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: "clear"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup vcpkg
        run: bash ./build-scripts/ci/setup-vcpkg.sh

      - name: Cache vcpkg binaries
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-android-vcpkg-${{ hashFiles('apps/android/cpp/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-android-vcpkg-

      - name: Prepare vcpkg cache
        run: mkdir -p "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

      # AGP 只自动安装默认 cmake 组件（3.22.1），非默认版本需显式预装
      - name: Install SDK CMake 3.31.1
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.31.1" > /dev/null

      # NDK 工程消费 apps/android/cpp/vcpkg.json manifest（与桌面同构）：
      # gradle → NDK CMake configure 时经 vcpkg toolchain 自动安装依赖
      - name: Build Android APK
        working-directory: apps/android
        run: |
          sed -i "s|^wingmanVcpkgRoot=.*|wingmanVcpkgRoot=$VCPKG_ROOT|" gradle.properties
          gradle :app:assembleDebug --no-daemon 2>&1 | tee gradle-build.log

      # AGP 的 "error parsing CMake File API result" 只给结论不给现场，
      # 失败时上传 .cxx（含 File API reply）供离线分析
      - name: Collect CMake diagnostics on failure
        if: failure()
        run: |
          tar czf cmake-fileapi-debug.tar.gz -C apps/android/app .cxx 2>/dev/null || true
          ls -la cmake-fileapi-debug.tar.gz || true

      - name: Upload CMake diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-cmake-debug
          path: |
            cmake-fileapi-debug.tar.gz
            apps/android/gradle-build.log
          retention-days: 5
          if-no-files-found: ignore

      # ====== Package ======
      - name: Package
        run: |
          version="${{ inputs.version }}"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk \
            "wingman-${version}-android-arm64.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wingman-${{ inputs.version }}-android-arm64
          path: wingman-${{ inputs.version }}-android-arm64.apk
          retention-days: 30
          overwrite: true

  # 统一 Release 发布：三平台构建全部成功后，顺序上传产物（gh release upload
  # --clobber + 指数退避重试 + 远端大小校验）。替代原先各平台 job 里的并发
  # softprops 上传——2026-09-17 一晚两次上传抖动（Windows Headers Timeout /
  # macOS 网关 HTML 错误页），且超时会留下 release 上的半截资产。构建产物
  # 经 artifacts 传递，release notes 仍由调用方统一写入（不携带 body）。
  publish-assets:
    name: Publish Release Assets
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
          pattern: wingman-${{ inputs.version }}-*

      - name: Upload to GitHub Release with retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          cd assets
          ls -la

          # release 不存在时兜底创建（正常路径：nightly 滚动 tag 已存在 /
          # release.yml create-release 已建 draft）
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG does not exist, creating"
            create_args=(--title "$RELEASE_TAG")
            if [ "$PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${create_args[@]}" --repo "$GITHUB_REPOSITORY"
          fi

          upload_one() {
            local f="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"; then
                return 0
              fi
              echo "::warning::Upload attempt $attempt failed for $f"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 30))
              fi
            done
            return 1
          }

          remote_size_of() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq ".assets[] | select(.name == \"$1\") | .size" || true
          }

          for f in wingman-*; do
            if [ ! -f "$f" ]; then
              continue
            fi
            local_size=$(stat -c%s "$f")
            verified=false

            for attempt in 1 2 3; do
              if ! upload_one "$f"; then
                echo "::error::All upload attempts failed for $f"
                exit 1
              fi

              # 远端大小校验：上传 API 可能超时中断但留下半截资产（2026-09-17
              # Windows 实例：31.6 MB 包只落了 3.65 MB），不校验会静默发布坏包
              remote_size=$(remote_size_of "$f")
              if [ -n "$remote_size" ] && [ "$remote_size" -eq "$local_size" ]; then
                echo "$f: $local_size bytes verified"
                verified=true
                break
              fi
              echo "::warning::Size mismatch for $f (local=$local_size remote=${remote_size:-none}), attempt $attempt — re-uploading"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 30))
              fi
            done

            if [ "$verified" != "true" ]; then
              echo "::error::Size verification failed for $f (local=$local_size remote=${remote_size:-none})"
              exit 1
            fi
          done

          echo "All assets uploaded and verified"
