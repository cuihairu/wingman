name: Build Agent

# Agent 单二进制矩阵（wingman-agent-<ver>-<os>-<arch>）：一键安装脚本
# （scripts/install.sh / install.ps1）的分发产物，与 build-package.yml 的
# 整包（GUI/Dashboard/server）分离——agent 只含 C++ runtime，构建快、包体
# 小，跨架构矩阵（linux/macos × x64/arm64、windows × x64/arm64）成本可控。
# 分发走 release 资产匿名直链（Actions artifacts 需登录，不作分发面）。

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g. v0.2.0 or 2026.06.07-nightly-abc1234)'
        required: true
        type: string
      version_suffix:
        description: 'Version suffix for CMake (e.g. 2026.06.07-nightly, empty for releases)'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'GitHub release tag to upload assets to; empty = artifacts only'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref (tag/branch/SHA) to checkout; empty falls back to github.ref'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark release as prerelease when creating a fallback release'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 2026.10.02-nightly-abc1234)'
        required: true
        type: string
      version_suffix:
        description: 'Version suffix for CMake (empty for releases)'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Release tag to upload to (empty = artifacts only)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to checkout (empty = default branch)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark release as prerelease when creating a fallback release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 顶层禁 env（同 build-package.yml 2026-10-03 规避）：workflow_call callee
# 顶层 env 会导致 caller 侧 job 静默 startup_failure。vcpkg 路径下沉到 build job。

jobs:
  build:
    name: Agent ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Linux/macOS 不配 NuGet 认证（同 build-package.yml：仅 Windows 配
    # readwrite 源），binary cache 走本地目录
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg/archives
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
      VCPKG_BINARY_SOURCES: ${{ matrix.os == 'windows' && format('clear;nuget,https://nuget.pkg.github.com/{0}/index.json,readwrite', github.repository_owner) || 'clear' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x64,   runner: ubuntu-latest,     triplet: x64-linux }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm,  triplet: arm64-linux }
          - { os: macos,   arch: x64,   runner: macos-15-intel,    triplet: x64-osx }
          - { os: macos,   arch: arm64, runner: macos-latest,      triplet: arm64-osx }
          - { os: windows, arch: x64,   runner: windows-2022,      triplet: x64-windows-static,      vs-generator: 'Visual Studio 17 2022' }
          # arm64 也用全静态 triplet：根 CMakeLists 无条件 /MT，static-md
          # （静态库+动态 CRT）会 LNK2038 RuntimeLibrary mismatch
          - { os: windows, arch: arm64, runner: windows-11-arm,    triplet: arm64-windows-static, vs-generator: 'Visual Studio 18 2026' }

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      # ====== Linux / macOS ======
      # arm64 runner 的 vcpkg-tool 不像 x64 腿那样自动下载 host cmake
      # （x64：A suitable version of cmake was not found → 下载
      # cmake-4.4.0-linux-x86_64），落回系统 cmake(<4.4)，而 vcpkg 基线
      # 脚本用了 string(JSON STRING_ENCODE)（CMake 4.4+ 新模式，
      # z_vcpkg_spdx.cmake），asio 等端口直接 BUILD_FAILED——预装 Kitware
      # cmake 4.4.0 aarch64 到 /usr/local（PATH 优先于 /usr/bin）
      - name: Install cmake 4.4 (linux arm64)
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          curl -fsSL --retry 3 -o /tmp/cmake-4.4.0.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-linux-aarch64.tar.gz
          sudo tar xzf /tmp/cmake-4.4.0.tar.gz -C /usr/local --strip-components=1
          cmake --version

      - name: Setup vcpkg (unix)
        if: matrix.os != 'windows'
        run: bash ./build-scripts/ci/setup-vcpkg.sh

      - name: Prepare vcpkg cache (unix)
        if: matrix.os != 'windows'
        run: mkdir -p "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

      - name: Install build tools (linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache mono-complete
          sudo apt-get install -y libx11-dev libxrandr-dev libxext-dev libxtst-dev libxt-dev libxinerama-dev
          # rpmbuild：nightly 原生包（CPack RPM generator）需要
          sudo apt-get install -y rpm

      - name: Install build tools (macos)
        if: matrix.os == 'macos'
        run: brew install cmake ninja mono

      - name: Configure CMake (unix)
        if: matrix.os != 'windows'
        run: >
          bash ./build-scripts/ci/configure-unix.sh
          "${{ matrix.triplet }}" "Ninja" "build" "Release" "${{ inputs.version_suffix }}" "OFF"

      - name: Build agent (unix)
        if: matrix.os != 'windows'
        run: cmake --build build --config Release --target wingman-agent --parallel

      # ====== Windows ======
      - name: Setup vcpkg (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./build-scripts/ci/setup-vcpkg.ps1

      - name: Add NuGet sources (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $patToken = "${{ secrets.VCPKG_PAT_TOKEN }}"
          if ([string]::IsNullOrEmpty($patToken)) {
            Write-Host "VCPKG_PAT_TOKEN not found, using GITHUB_TOKEN (may have limited permissions)"
            $patToken = "${{ github.token }}"
          }
          $feed = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          $user = "${{ github.repository_owner }}"
          .\vcpkg\vcpkg fetch nuget | ForEach-Object { & $_ sources add `
            -Source $feed `
            -StorePasswordInClearText `
            -Name "GitHubPackages" `
            -UserName $user `
            -Password $patToken }
          .\vcpkg\vcpkg fetch nuget | ForEach-Object { & $_ setapikey $patToken -Source $feed }

      - name: Prepare vcpkg cache (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Configure CMake (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: >
          ./build-scripts/ci/configure-windows.ps1
          -BuildDir build
          -Config Release
          -Platform "${{ matrix.arch == 'arm64' && 'ARM64' || 'x64' }}"
          -Triplet "${{ matrix.triplet }}"
          -VersionSuffix "${{ inputs.version_suffix }}"
          -Generator "${{ matrix.vs-generator || 'Visual Studio 17 2022' }}"

      - name: Build agent (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: cmake --build build --config Release --target wingman-agent --parallel

      # ====== Package ======
      # 单二进制产物 + VERSION.txt（无 GUI/Dashboard/server——agent 安装面）
      - name: Package (unix)
        if: matrix.os != 'windows'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dist="dist-wingman-agent"
          mkdir -p "$dist"
          cp "build/apps/agent/wingman-agent" "$dist/wingman-agent"
          chmod +x "$dist/wingman-agent"
          # Linux crashpad 构建的 agent 启动需要同目录 crashpad_handler
          # （argv[0] 同目录解析，缺失即 FATAL）；macOS 默认无该目标
          [ -f build/apps/agent/crashpad_handler ] && \
            cp build/apps/agent/crashpad_handler "$dist/" || true
          cat > "$dist/VERSION.txt" << EOF
          Wingman Agent $VERSION
          Build Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Commit: ${{ github.sha }}
          Platform: ${{ matrix.os }}-${{ matrix.arch }}
          EOF
          tar czf "wingman-agent-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C "$dist" .
          ls -la wingman-agent-*.tar.gz

      # ====== 原生安装包（仅 nightly：version_suffix 非空即 nightly 线）======
      # CPack 消费根 CMakeLists 的 install 规则（/usr/bin/wingman-agent +
      # /usr/share/wingman-agent），deb 依赖由 dpkg-shlibdeps 自动推导。
      # 冒烟：version 子命令能跑通即证明包内二进制可执行（同 install.sh 的验证口径）。
      - name: Package native (deb + rpm)
        if: matrix.os == 'linux' && inputs.version_suffix != ''
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ./build/apps/agent/wingman-agent version
          # 双 generator 必须分号列表一次传入（-G 重复指定时后者覆盖前者）
          (cd build && cpack -G "DEB;RPM")
          for f in build/wingman-agent-*.deb; do
            mv "$f" "wingman-agent-${VERSION}-linux-${ARCH}.deb"
          done
          for f in build/wingman-agent-*.rpm; do
            mv "$f" "wingman-agent-${VERSION}-linux-${ARCH}.rpm"
          done
          ls -la wingman-agent-*.deb wingman-agent-*.rpm

      - name: Package (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $dist = "dist-wingman-agent"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build\apps\agent\Release\wingman-agent.exe" "$dist\wingman-agent.exe"
          @"
          Wingman Agent $env:VERSION
          Build Date: $(Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          Commit: ${{ github.sha }}
          Platform: ${{ matrix.os }}-${{ matrix.arch }}
          "@ | Out-File -FilePath "$dist\VERSION.txt" -Encoding UTF8
          Compress-Archive -Path "$dist\*" -DestinationPath "wingman-agent-$env:VERSION-${{ matrix.os }}-${{ matrix.arch }}.zip" -Force
          Get-ChildItem wingman-agent-*.zip

      # ====== 原生安装包（仅 nightly：version_suffix 非空即 nightly 线）======
      # WiX v3 在 windows-2022 预装（3.14.1.8722）；未预装时如实跳过。
      # 本地验证命令（ProductVersion 取 agent 二进制上报的版本，如 0.1.2）：
      #   candle.exe -arch x64 -dProductVersion=0.1.2 \
      #     -dAgentExe=<path>\wingman-agent.exe build-scripts\packaging\wingman-agent.wxs
      #   light.exe -out wingman-agent.msi wingman-agent.wixobj
      - name: Package native (msi)
        if: matrix.os == 'windows' && inputs.version_suffix != ''
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3.*\bin\candle.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            Write-Host "::warning::WiX v3 not found on this runner, MSI package skipped"
            return
          }
          $binDir = Split-Path $wix.FullName
          $light = Join-Path $binDir 'light.exe'
          $dark = Join-Path $binDir 'dark.exe'

          $version = $env:VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { throw "VERSION env is empty" }

          # 冒烟：包内二进制可执行（与 linux 腿的 version 子命令同口径），并顺带
          # 取真实版本号（Product/@Version 的单一事实源，不硬编码进 wxs）
          $exe = (Resolve-Path '.\build\apps\agent\Release\wingman-agent.exe').Path
          $banner = (& $exe version | Out-String).Trim()
          Write-Host "agent banner: $banner"
          # banner 形如 "Wingman 0.1.2-2026.11.14-nightly"：剥非数字前缀与 nightly 后缀
          $productVersion = ($banner -replace '^[^0-9]*', '') -replace '-.*$', ''
          # MSI 版本属性按位宽强约束：major/minor<256、build<65536
          if ($productVersion -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
            throw "could not read numeric version from banner '$banner'"
          }
          if ([int]$Matches[1] -ge 256 -or [int]$Matches[2] -ge 256 -or [int]$Matches[3] -ge 65536) {
            throw "productVersion '$productVersion' exceeds MSI bit width (256/256/65536)"
          }

          # define 值拼进单个数组元素：裸词 -dX=$var 在原生调用里可能不展开
          $candleArgs = @(
            '-arch', $env:ARCH,
            "-dProductVersion=$productVersion",
            "-dAgentExe=$exe",
            '-out', 'wingman-agent.wixobj',
            'build-scripts\packaging\wingman-agent.wxs'
          )
          Write-Host ('candle argv: ' + ($candleArgs -join ' '))
          & $wix.FullName @candleArgs
          if ($LASTEXITCODE -ne 0) { throw "candle failed with exit code $LASTEXITCODE" }
          & $light -out wingman-agent.msi wingman-agent.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit code $LASTEXITCODE" }

          $msi = "wingman-agent-$version-windows-$env:ARCH.msi"
          Move-Item wingman-agent.msi $msi

          # 结构冒烟（不安装）：dark 能反编译 + **载荷组件真的编进了 MSI 数据库**。
          # 只验「能解析」判别力不足——能解析的空壳也会过。故额外断言反编译出的
          # 源里含 keypath 文件组件 AgentExecutable，否则 MSI 是"结构对但没货"。
          # dark 把产物写进**调用者 CWD**：<msi 基名>.wxs + .wixloc + .wixpdb 落在
          # 当前目录，只有 <msi 基名>\ 子目录才装反编译表；故 .wxs 在 msi-smoke 根，
          # 不在 msi-extract 里。CWD 必须在子目录，否则 .wxs 会匹配 Upload artifacts 的
          # path glob 被当成资产上传到 release。
          Push-Location (New-Item -ItemType Directory -Force -Path 'msi-smoke').FullName
          & $dark -x msi-extract $msi
          if ($LASTEXITCODE -ne 0) { throw "dark failed with exit code $LASTEXITCODE" }
          # dark 命名时**剥掉 .msi 后缀**再补 .wxs（实测产物名 …-windows-x64.wxs，
          # 不是 …-windows-x64.msi.wxs）——按 msi 全名拼会永远找不到。
          $decompiled = Join-Path (Get-Location) ((Split-Path $msi -Leaf) -replace '\.msi$', '.wxs')
          if (-not (Test-Path $decompiled)) { throw "dark produced no $decompiled (empty msi?)" }
          if ((Get-Content $decompiled -Raw) -notmatch 'Id="AgentExecutable"') {
            throw "decompiled msi has no AgentExecutable component: payload not embedded"
          }
          Write-Host "payload component asserted in $(Split-Path $decompiled -Leaf)"
          Get-ChildItem msi-extract -Directory | Select-Object -First 8 | ForEach-Object { $_.Name }

          # 载荷指纹供与 windows-x64.zip 资产离线对账（Windows runner 无 msiextract，
          # 无法在 CI 内直接解 cab；hash 一致即证 MSI 内嵌的就是这份 exe）。
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "source exe sha256=$hash size=$((Get-Item $exe).Length)"
          Pop-Location
          Get-Item $msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wingman-agent-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: wingman-agent-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.*
          retention-days: 30
          overwrite: true

  # 统一上传 release 资产（release_tag 为空则只保留 artifacts）：与
  # build-package.yml publish-assets 同款纪律——gh release upload --clobber
  # + 指数退避重试 + 远端大小校验（上传 API 超时会留下半截资产）。
  publish-assets:
    name: Publish Agent Assets
    needs: build
    # 任一带失败也要跑：矩阵腿互相独立，已成功腿（如 linux deb/rpm）的产物
    # 不该被另一腿（如 windows msi）的失败连带吞掉。
    if: always() && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all agent artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: assets
          merge-multiple: true
          pattern: wingman-agent-${{ inputs.version }}-*

      - name: Upload to GitHub Release with retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          cd assets
          ls -la
          shopt -s nullglob
          files=(wingman-agent-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No agent artifacts to publish"
            exit 1
          fi

          # release 不存在时兜底创建（正常路径：nightly 滚动 tag 已存在）
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG does not exist, creating"
            create_args=(--title "$RELEASE_TAG")
            if [ "$PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${create_args[@]}" --repo "$GITHUB_REPOSITORY"
          fi

          upload_one() {
            local f="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"; then
                return 0
              fi
              echo "::warning::Upload attempt $attempt failed for $f"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 30))
              fi
            done
            return 1
          }

          # 按 tag 查 release 的端点（/releases/tags/<tag>）对 draft 恒返回
          # 404——GitHub API 不允许按 tag 取未发布的 release。正式版走
          # create-release 建的正是 draft，因此这里必须走 release id：
          # 先从 /releases 列表按 tag 筛出 id（列表端点包含 draft），再用
          # id 取资产大小。上传本身用 gh release upload（其内部按 id 或
          # fallback 解析），此前失败全在校验环节而非上传。
          release_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -1
          }

          remote_size_of() {
            local rid="$1" name="$2"
            [ -n "$rid" ] || return 0
            gh api "repos/$GITHUB_REPOSITORY/releases/$rid" \
              --jq ".assets[] | select(.name == \"$name\") | .size" || true
          }

          RELEASE_ID=$(release_id)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not resolve release id for tag $RELEASE_TAG"
            exit 1
          fi
          echo "Release id for $RELEASE_TAG: $RELEASE_ID"

          for f in "${files[@]}"; do
            local_size=$(stat -c%s "$f")
            verified=false
            for attempt in 1 2 3; do
              if ! upload_one "$f"; then
                echo "::error::All upload attempts failed for $f"
                exit 1
              fi
              remote_size=$(remote_size_of "$RELEASE_ID" "$f")
              if [ -n "$remote_size" ] && [ "$remote_size" -eq "$local_size" ]; then
                echo "$f: $local_size bytes verified"
                verified=true
                break
              fi
              echo "::warning::Size mismatch for $f (local=$local_size remote=${remote_size:-none}), attempt $attempt — re-uploading"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 30))
              fi
            done
            if [ "$verified" != "true" ]; then
              echo "::error::Size verification failed for $f (local=$local_size remote=${remote_size:-none})"
              exit 1
            fi
          done

          echo "All agent assets uploaded and verified"
