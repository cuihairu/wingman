name: Nightly Build

on:
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = 北京时间次日 04:00
  workflow_dispatch:

permissions:
  packages: write
  contents: write

jobs:
  check-activity:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if repo has recent activity
        id: check
        run: |
          # 获取最近 commit 的时间
          LAST_COMMIT=$(gh api repos/${{ github.repository }}/commits/main --jq '.commit.author.date' 2>/dev/null || echo "")
          if [ -z "$LAST_COMMIT" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "No commits found on main"
            exit 0
          fi

          # 计算距今天数
          SECONDS_SINCE=$(($(date +%s) - $(date -d "$LAST_COMMIT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_COMMIT" +%s)))
          DAYS_SINCE=$((SECONDS_SINCE / 86400))

          echo "Last commit: $LAST_COMMIT ($DAYS_SINCE days ago)"

          if [ $DAYS_SINCE -le 7 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping: last commit was $DAYS_SINCE days ago (> 7 days)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve-version:
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_suffix: ${{ steps.ver.outputs.version_suffix }}
    steps:
      - name: Generate nightly version
        id: ver
        run: |
          date=$(date +%Y.%m.%d)
          commit="${{ github.sha }}"
          short="${commit:0:7}"
          echo "version=${date}-nightly-${short}" >> $GITHUB_OUTPUT
          echo "version_suffix=${date}-nightly" >> $GITHUB_OUTPUT

  build:
    name: Nightly Build & Release
    needs: resolve-version
    uses: ./.github/workflows/build-package.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_suffix: ${{ needs.resolve-version.outputs.version_suffix }}
      release_tag: nightly
      prerelease: true

  # build-package 不再写入 release body，nightly 说明在此统一维护
  nightly-notes:
    name: Nightly Release Notes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update nightly release body
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            ## Wingman Nightly ${{ needs.resolve-version.outputs.version }}

            每日自动构建（UTC 20:00 / 北京时间次日 04:00），基于 main 分支最新提交。

            ### Package Contents
            | File | Description |
            |------|-------------|
            | `wingman-*-windows-x64.zip` | C++ Runtime / Tauri GUI Installer / Go Server / Dashboard / scripts / config |
            | `wingman-*-linux-x64.tar.gz` | C++ Runtime / Tauri AppImage+deb / Go Server / Dashboard / scripts / config |
            | `wingman-*-macos-x64.tar.gz` | C++ Runtime / Tauri dmg+app / Go Server / Dashboard / scripts / config |
            | `wingman-*-android-arm64.apk` | Android Agent（arm64，debug 签名；iOS 因无签名证书暂不提供） |

            ⚠️ nightly 为预发布构建，仅供测试，不建议生产使用。
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布成功后修剪历史资产：nightly 只提供最新构建——保留今日资产中
  # 最新 sha 的一组，删除其余全部（历史日期、同日旧 sha、旧格式遗留包）。
  # 今日尚无构建资产时不动，避免误删昨天唯一可用版本。
  cleanup-assets:
    name: Prune Old Nightly Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Keep only today's latest build assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export REPO="${{ github.repository }}"
          export TODAY="$(date -u +%Y.%m.%d)"
          python3 - <<'PY'
          import json, os, re, subprocess

          repo, today = os.environ["REPO"], os.environ["TODAY"]
          rel = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases/tags/nightly"]))

          def delete(a):
              print("删除:", a["name"])
              subprocess.check_call(["gh", "api", "-X", "DELETE",
                  f"repos/{repo}/releases/assets/{a['id']}"])

          groups = {}  # (date, sha) -> [asset]
          for a in rel["assets"]:
              m = re.match(r"^wingman-(\d{4}\.\d{2}\.\d{2})-nightly-([0-9a-f]+)-", a["name"])
              if not m:
                  delete(a)  # 不带日期的旧格式遗留包
                  continue
              groups.setdefault(m.groups(), []).append(a)

          today_groups = {k: v for k, v in groups.items() if k[0] == today}
          if not today_groups:
              print("今日尚无构建资产，保留全部日期资产不动")
              raise SystemExit(0)
          keep = max(today_groups, key=lambda k: max(
              a["updatedAt"] for a in today_groups[k]))
          print("保留今日最新组:", keep)
          for key, assets in groups.items():
              for a in assets:
                  delete(a) if key != keep else print("保留:", a["name"])
          print("清理完成")
          PY
