name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

permissions:
  packages: write
  contents: write

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version / prerelease / release notes
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

          # 预发布版本自动判定（v0.2.0-rc1 / -beta / -nightly 等）
          if [[ "$TAG" =~ -(rc|beta|alpha|nightly|dev|pre) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # 从 CHANGELOG.md 提取该 tag 的段落作为 release notes
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            {
              echo "Wingman ${TAG}"
              echo ""
              echo "变更详情见 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。"
            } > release_notes.md
          fi

          # GitHub release body 上限 125000 字符，超出部分被**静默截断**：写入不
          # 报错，读回来才发现尾巴没了。v0.1.2 实测：CHANGELOG 段落 218411 字节，
          # release body 只剩 124994 字符——尾部条目与 create-release 追加的
          # Package Contents 附录整段丢失（2026-10-03 run 37086451387 后的 draft）。
          # 官方文档只说"限制"，不报错，故在此源头按 100000 字符截断并补指针：
          # 保留头部（本就有 🎉 摘要 + 最近条目，用户最先看的部分），完整记录
          # 指向 CHANGELOG。
          python3 - <<'PY'
          import os

          LIMIT = 100_000
          path = "release_notes.md"
          text = open(path, encoding="utf-8").read()
          if len(text) > LIMIT:
              head = text[:LIMIT]
              # 回退到最后一个换行，避免把条目/UTF-8 字符切成两半
              head = head[: head.rfind("\n")]
              tail = (
                  "\n\n---\n\n"
                  "以上为节选（完整记录见 [CHANGELOG.md]"
                  f"(https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/main/CHANGELOG.md)）。\n"
              )
              text = head + tail
              open(path, "w", encoding="utf-8").write(text)
              print(f"release notes truncated to {len(text)} chars (limit {LIMIT})")
          else:
              print(f"release notes length {len(text)} chars — within limit")
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 7
          overwrite: true

  # 先创建 draft release：
  # 1. release notes 仅在此处写入一次，避免三平台构建 job 并行上传时互相覆盖 body
  # 2. workflow_dispatch 指定尚不存在的 tag 时，此处会基于当前 commit 创建 tag，
  #    保证后续 build job 能按 ref=tag 检出与 release 一致的代码
  create-release:
    name: Create Draft Release
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: .

      - name: Append package contents
        run: |
          cat >> release_notes.md <<'EOF'

          ### Package Contents

          | Package | Platform | Contents |
          |---------|----------|----------|
          | `wingman-*-windows-x64.zip` | Windows x64 | C++ runtime / Tauri GUI installer (NSIS) / Go orchestrator server / dashboard / scripts / config |
          | `wingman-*-linux-x64.tar.gz` | Linux x64 | C++ runtime / Tauri GUI (AppImage, deb) / Go orchestrator server / dashboard / scripts / config |
          | `wingman-*-macos-x64.tar.gz` | macOS x64 | C++ runtime / Tauri GUI (dmg, app) / Go orchestrator server / dashboard / scripts / config |
          | `wingman-*-android-arm64.apk` | Android arm64 | wingman agent（手势注入 / 屏幕采集 / 找色找图 / 远程截图），装在目标安卓设备上 |
          | `wingman-agent-*`（六腿） | linux / macos / windows × x64 / arm64 | agent 单二进制，供 `install.sh` / `install.ps1` 一键安装分发；arm64 桌面的 agent 覆盖由此承担（暂无 arm64 桌面全量包） |

          校验和见 `SHA256SUMS.txt`，逐包校验步骤见 `VERIFY.md`，构建元信息见 `BUILD_INFO.txt`。
          EOF

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: ${{ needs.resolve-version.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ needs.resolve-version.outputs.prerelease }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & Upload Assets
    needs: [resolve-version, create-release]
    uses: ./.github/workflows/build-package.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      release_tag: ${{ needs.resolve-version.outputs.tag }}
      ref: ${{ needs.resolve-version.outputs.ref }}
      # fromJSON 转型是必需的，不是风格问题：callee 把 prerelease 声明为
      # type: boolean，而 job outputs 一律是字符串（"true"/"false"）。GitHub 在
      # 图构建期做类型校验，字符串直传 boolean 类型的 with: 会让整个 reusable
      # job 被静默丢弃——run 里只剩 resolve-version/create-release，无
      # check-run、无 annotation、内层 run 不创建，publish-release 随之 skipped
      # 而整条 run 记 failure（37081668034 / 37085699901 复现）。fromJSON
      # 把 outputs 字符串还原成真 boolean，job 正常创建。
      prerelease: ${{ fromJSON(needs.resolve-version.outputs.prerelease) }}
    secrets: inherit

  # Agent 单二进制矩阵（linux/macos/windows × x64/arm64，与 nightly 同源）：
  # 一键安装脚本的分发产物；arm64 桌面全量包暂无构建矩阵，arm64 覆盖由此承担
  build-agent:
    name: Agent Matrix
    needs: [resolve-version, create-release]
    uses: ./.github/workflows/build-agent.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      release_tag: ${{ needs.resolve-version.outputs.tag }}
      ref: ${{ needs.resolve-version.outputs.ref }}
      prerelease: ${{ fromJSON(needs.resolve-version.outputs.prerelease) }}
    secrets: inherit

  # 全部平台构建成功后才发布：
  # 1. 汇总三平台产物生成 SHA256SUMS.txt（含 APK）+ BUILD_INFO.txt + VERIFY.md
  # 2. 将 draft release 正式发布（draft=false）
  # 若任一平台构建失败，draft 保留在 Releases 页面便于排查，不会发布半成品
  publish-release:
    name: Publish Release
    needs: [resolve-version, build, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
          pattern: wingman-${{ needs.resolve-version.outputs.version }}-*

      - name: Generate SHA256SUMS / BUILD_INFO / VERIFY
        run: |
          ls -la assets/
          cd assets
          sha256sum wingman-*.zip wingman-*.tar.gz wingman-*.apk > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"

          {
            echo "Wingman ${{ needs.resolve-version.outputs.version }}"
            echo "Tag:        ${{ needs.resolve-version.outputs.tag }}"
            echo "Commit:     ${{ needs.resolve-version.outputs.ref }}"
            echo "Build time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Assets"
            ls wingman-* | sed 's/^/- /'
          } > "$GITHUB_WORKSPACE/BUILD_INFO.txt"

          {
            echo "# 校验下载完整性（VERIFY）"
            echo
            echo '下载 \`SHA256SUMS.txt\` 与目标包到同一目录后执行：'
            echo
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
            echo
            echo 'macOS 可用 \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`；'
            echo 'Windows PowerShell 可用 \`Get-FileHash\` 对照 SHA256SUMS.txt 中的值。'
          } > "$GITHUB_WORKSPACE/VERIFY.md"

      - name: Upload checksums & build info
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          files: |
            SHA256SUMS.txt
            BUILD_INFO.txt
            VERIFY.md
          prerelease: ${{ needs.resolve-version.outputs.prerelease }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: |
          gh release edit "${{ needs.resolve-version.outputs.tag }}" \
            --draft=false \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
