# 8080：nginx-unprivileged 镜像以 nginx 用户运行，不能绑定 <1024 特权端口
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests -> wingman server on the shared docker network
    location /api/ {
        proxy_pass http://wingman-server:9527;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (server /ws endpoint, used for realtime push)
    location /ws {
        proxy_pass http://wingman-server:9527;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # History API fallback for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
