            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 停止脚本
      tags:
      - scripts
  /v1/settings:
    get:
      description: 返回 DB 配置并填充默认值；需要 settings:view 权限（dashboard 兼容路径 /settings 等价）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取系统配置
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: 按 key-value 逐项 upsert；需要 settings:edit 权限（dashboard 兼容路径 /settings
        等价）
      parameters:
      - description: 配置键值对
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新系统配置
      tags:
      - settings
  /v1/status:
    get:
      description: 汇总脚本/窗口数量与资源占用（可指定 agentId，缺省取首个在线 agent）
      parameters:
      - description: Agent ID（缺省自动选择在线 agent）
        in: query
        name: agentId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 系统状态
      tags:
      - status
  /v1/windows:
    get:
      description: 经 agent 通道转发 list_windows；未指定 agentId 时自动选择首个在线 agent
      parameters:
      - description: Agent ID（缺省自动选择在线 agent）
        in: query
        name: agentId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 窗口列表
      tags:
      - windows
  /workflow-templates:
    get:
      description: 内置模板目录：单步监控/并行采集/串行流水线/fan-out/独立步骤类型 wait-condition-screenshot；可直接作为创建工作流的
        steps 骨架
      produces:
      - application/json
      responses:
        "200":
          description: data 为模板数组（name/description/steps）
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 工作流模板库
      tags:
      - workflows
  /workflows:
    get:
      description: 返回所有工作流记录（含状态：pending/running/completed/failed/cancelled）；任何登录用户可读
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ListWorkflowsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 数据库查询失败
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 工作流列表
      tags:
      - workflows
    post:
      consumes:
      - application/json
      description: 校验步骤定义（依赖关系/worker 存在性）后提交引擎调度，调度失败时回滚 DB 记录；需要 workflows:run 权限
      parameters:
      - description: 工作流定义
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateWorkflowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: data.workflowId 为新建工作流 ID
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 步骤校验失败或请求体格式错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 序列化或 DB 写入失败
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建工作流
      tags:
      - workflows
  /workflows/{id}:
    get:
      description: 返回工作流定义、步骤状态与共享上下文快照（运行中与已结束均可查询）
      parameters:
      - description: 工作流 ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WorkflowDetailResponse'
        "400":
          description: id 非数字
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: 工作流不存在
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 工作流详情
      tags:
      - workflows
  /workflows/{id}/cancel:
    post:
      description: 取消运行中的工作流（通知引擎中止后续步骤）并写审计日志；需要 workflows:run 权限
      parameters:
      - description: 工作流 ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: id 非数字或工作流不可取消
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 取消工作流
      tags:
      - workflows
  /workflows/{id}/steps/{stepId}/status:
    get:
      description: 合并 DB 记录与引擎内存快照，返回单步的实时执行状态（status/message/workerId/起止时间）；任何登录用户可读
      parameters:
      - description: 工作流 ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      - description: 步骤 ID
        example: s1
        in: path
        name: stepId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.StepStatusResponse'
        "400":
          description: id 非数字
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: 步骤状态记录不存在
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 工作流步骤状态
      tags:
      - workflows
  /workflows/{id}/workers:
    get:
      description: 汇总步骤状态中按 workerId 去重的 worker（agent）信息；任何登录用户可读
      parameters:
      - description: 工作流 ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WorkerListResponse'
        "400":
          description: id 非数字
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 工作流 worker 列表
      tags:
      - workflows
securityDefinitions:
  BearerAuth:
    description: '"Bearer <JWT>"（由 POST /api/v1/auth/login 获取）'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
