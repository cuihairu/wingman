basePath: /api
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handlers.CreateScriptRequest:
    properties:
      description:
        example: 血量监控示例脚本
        type: string
      name:
        description: 脚本名（不含扩展名时自动补 .lua；禁止路径穿越字符）
        example: demo
        type: string
    required:
    - name
    type: object
  handlers.CreateScriptResponse:
    properties:
      data:
        $ref: '#/definitions/models.Script'
      success:
        example: true
        type: boolean
    type: object
  handlers.CreateWorkflowRequest:
    properties:
      description:
        description: 工作流描述
        example: 单步监控流水线
        type: string
      name:
        description: 工作流名称
        example: monitor
        type: string
      sharedContext:
        additionalProperties: {}
        description: 跨步骤共享上下文（步骤间传参）
        type: object
      steps:
        description: '步骤列表（type: script/wait/condition/screenshot；通过 dependsOn 声明依赖）'
        items:
          $ref: '#/definitions/models.WorkflowStep'
        type: array
    required:
    - name
    - steps
    type: object
  handlers.DebuggerInfoResponse:
    properties:
      agents:
        description: 各 agent 的调试端点
        items:
          $ref: '#/definitions/handlers.agentDebugEndpoint'
        type: array
      defaultPort:
        description: runtime 默认调试端口
        example: 9966
        type: integer
      description:
        description: 模式说明
        example: 'Lua debugging via EmmyLua: VSCode attaches directly to the runtime
          debug port.'
        type: string
      launchConfig:
        additionalProperties: {}
        description: VSCode launch.json 片段
        type: object
      mode:
        description: 固定为 direct_attach
        example: direct_attach
        type: string
      success:
        example: true
        type: boolean
      vscodeExtension:
        description: 推荐的 VSCode 扩展
        example: tangzx.emmylua
        type: string
    type: object
  handlers.DirectAttachResponse:
    properties:
      error:
        description: 说明调试协议不经 server 中转
        example: EmmyLua debugging is not proxied through the server. Use VSCode EmmyLua
          to attach directly to the runtime debug port.
        type: string
      hint:
        description: 获取各 agent 调试端点的入口
        example: GET /api/debugger/info returns each agent's debug endpoint and a
          VSCode launch.json snippet.
        type: string
      mode:
        description: 固定为 direct_attach
        example: direct_attach
        type: string
      operation:
        description: 触发本次拒绝的操作名
        example: connect
        type: string
      success:
        example: false
        type: boolean
      vscodeExtension:
        description: 推荐的 VSCode 扩展
        example: tangzx.emmylua
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        description: Error 人类可读的错误说明
        example: insufficient permissions
        type: string
      success:
        description: Success 固定为 false
        example: false
        type: boolean
    type: object
  handlers.ListScriptsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Script'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.ListWorkflowsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Workflow'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.LogEntry:
    properties:
      level:
        description: 日志级别（info/warn/error）
        example: info
        type: string
      message:
        description: 日志内容
        example: script started
        type: string
      timestamp:
        description: 毫秒时间戳
        example: 1712937600000
        type: integer
    type: object
  handlers.LogListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.LogEntry'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.QueryLogsRequest:
    properties:
      executionId:
        description: 执行 ID（脚本名）
        example: demo
        type: string
      limit:
        description: 每页条数（1-500，缺省 100）
        example: 100
        type: integer
      offset:
        description: 分页偏移（0 起）
        example: 0
        type: integer
    required:
    - executionId
    type: object
  handlers.RunScriptData:
    properties:
      agent:
        additionalProperties: {}
        description: agent 通道的原始响应（command result data）
        type: object
      executionId:
        description: 本次执行 ID（等于脚本名，停止时使用）
        example: demo
        type: string
    type: object
  handlers.RunScriptRequest:
    properties:
      agentId:
        description: 目标 Agent ID（缺省自动选择首个在线 agent）
        example: agent-001
        type: string
      path:
        description: 相对 scripts 目录的脚本路径
        example: demo.lua
        type: string
    required:
    - path
    type: object
  handlers.RunScriptResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.RunScriptData'
      success:
        example: true
        type: boolean
    type: object
  handlers.SaveScriptRequest:
    properties:
      content:
        description: 脚本全文（Lua 源码）
        example: function main() print("hi") end
        type: string
      path:
        description: 相对 scripts 目录的脚本路径
        example: demo.lua
        type: string
    required:
    - content
    - path
    type: object
  handlers.ScreenshotRequest:
    properties:
      height:
        type: integer
      image:
        type: string
      timestamp:
        type: integer
      width:
        type: integer
    type: object
  handlers.ScriptPathRequest:
    properties:
      path:
        description: 相对 scripts 目录的脚本路径
        example: demo.lua
        type: string
    required:
    - path
    type: object
  handlers.StepStatusResponse:
    properties:
      data:
        $ref: '#/definitions/models.StepStatus'
      success:
        example: true
        type: boolean
    type: object
  handlers.StopScriptRequest:
    properties:
      agentId:
        description: 目标 Agent ID（缺省自动选择首个在线 agent）
        example: agent-001
        type: string
      executionId:
        description: 执行 ID（脚本名，run 响应中的 executionId）
        example: demo
        type: string
    required:
    - executionId
    type: object
  handlers.SuccessResponse:
    properties:
      success:
        example: true
        type: boolean
    type: object
  handlers.TriggerActionRequest:
    properties:
      delay:
        example: 500
        type: integer
      type:
        example: RunScript
        type: string
      value:
        example: heal.lua
        type: string
      x:
        example: 0
        type: integer
      "y":
        example: 0
        type: integer
    type: object
  handlers.TriggerConditionRequest:
    properties:
      enabled:
        example: true
        type: boolean
      interval:
        example: 1000
        type: integer
      region:
        $ref: '#/definitions/handlers.TriggerRegionRequest'
      tolerance:
        example: 10
        type: integer
      type:
        example: ColorFound
        type: string
      value:
        example: '#ff0000'
        type: string
    type: object
  handlers.TriggerConfigRequest:
    properties:
      actions:
        description: |-
          actions 触发动作序列（RunScript/Click/KeyPress/Type/StopScript/
          PauseScript/ShowMessage/PlayAudio/Log/Delay）
        items:
          $ref: '#/definitions/handlers.TriggerActionRequest'
        type: array
      condition:
        allOf:
        - $ref: '#/definitions/handlers.TriggerConditionRequest'
        description: |-
          condition 触发条件（11 种类型：ColorFound/ColorLost/ImageFound/ImageLost/
          WindowOpened/WindowClosed/ProcessStarted/ProcessStopped/TimeElapsed/
          HotkeyPressed/PixelChanged）
      cooldown:
        example: 3000
        type: integer
      enabled:
        example: true
        type: boolean
      name:
        description: 触发器名称（新增时必填，runtime 缺省 Unnamed Trigger）
        example: hp-watch
        type: string
      oneShot:
        example: false
        type: boolean
    type: object
  handlers.TriggerRegionRequest:
    properties:
      height:
        example: 50
        type: integer
      width:
        example: 50
        type: integer
      x:
        example: 100
        type: integer
      "y":
        example: 200
        type: integer
    type: object
  handlers.TriggerToggleRequest:
    properties:
      id:
        description: runtime 分配的触发器 ID（trigger.list 返回的字符串数字）
        example: "42"
        type: string
    required:
    - id
    type: object
  handlers.WorkerEntry:
    properties:
      endTime:
        description: 结束时间（毫秒）
        example: 1712937620000
        type: integer
      startTime:
        description: 开始时间（毫秒）
        example: 1712937610000
        type: integer
      status:
        description: 步骤状态
        example: completed
        type: string
      stepId:
        description: 该 worker 承担的首个步骤 ID
        example: s1
        type: string
      workerId:
        description: Agent ID
        example: agent-001
        type: string
    type: object
  handlers.WorkerListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.WorkerEntry'
        type: array
      success:
        example: true
        type: boolean
    type: object
  handlers.WorkflowDetailData:
    properties:
      createdTime:
        description: 创建时间（毫秒）
        example: 1712937600000
        type: integer
      description:
        description: 描述
        example: 单步监控流水线
        type: string
      endTime:
        description: 结束时间（毫秒，未结束为 0）
        example: 1712937620000
        type: integer
      id:
        description: 工作流 ID
        example: 1
        type: integer
      name:
        description: 名称
        example: monitor
        type: string
      sharedContext:
        additionalProperties: {}
        description: 共享上下文快照
        type: object
      startTime:
        description: 开始时间（毫秒，未开始为 0）
        example: 1712937610000
        type: integer
      status:
        description: 状态：pending/running/completed/failed/cancelled
        example: completed
        type: string
      stepStatus:
        additionalProperties: {}
        description: 各步骤实时状态（stepId → 状态）
        type: object
      steps:
        description: 步骤定义列表
        items:
          $ref: '#/definitions/models.WorkflowStep'
        type: array
    type: object
  handlers.WorkflowDetailResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.WorkflowDetailData'
      success:
        example: true
        type: boolean
    type: object
  handlers.agentDebugEndpoint:
    properties:
      agentId:
        example: agent-001
        type: string
      endpoint:
        example: 10.0.0.5:9966
        type: string
      host:
        example: 10.0.0.5
        type: string
      hostname:
        example: game-pc
        type: string
      ip:
        example: 10.0.0.5
        type: string
      port:
        example: 9966
        type: integer
      reachable:
        example: true
        type: boolean
      status:
        example: online
        type: string
    type: object
  models.Script:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      id:
        type: integer
      is_running:
        type: boolean
      name:
        type: string
      path:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  models.StepStatus:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      endTime:
        type: string
      id:
        type: integer
      message:
        type: string
      name:
        type: string
      startTime:
        type: string
      status:
        description: pending/running/completed/failed/skipped
        type: string
      stepId:
        type: string
      updatedAt:
        type: string
      workerId:
        type: string
      workflowId:
        type: integer
    type: object
  models.Workflow:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      endTime:
        type: string
      id:
        type: integer
      name:
        type: string
      startTime:
        type: string
      status:
        description: pending/running/completed/failed/cancelled
        type: string
      updatedAt:
        type: string
    type: object
  models.WorkflowStep:
    properties:
      dependsOn:
        items:
          type: string
        type: array
      id:
        type: string
      maxRetries:
        description: 失败重试次数（0=不重试）
        type: integer
      name:
        type: string
      parameters:
        additionalProperties: true
        type: object
      retryBackoffSeconds:
        description: 重试退避基数（秒，默认 2，指数翻倍）
        type: integer
      script:
        type: string
      timeoutSeconds:
        type: integer
      type:
        description: 步骤类型：script(默认)/wait/condition/screenshot
        type: string
      workers:
        items:
          type: string
        type: array
    type: object
host: localhost:9527
info:
  contact: {}
  description: |-
    Wingman 远程中控编排器 HTTP API（auth / RBAC / agent / script / workflow / messages / settings）。
    架构约束：Dashboard 与远程客户端只连接本 server，不直连 runtime。
  title: Wingman Orchestrator API
  version: "1.0"
paths:
  /admin/permissions:
    get:
      description: 返回全部权限码目录，支持按分类过滤；需要 users:manage 或 roles:manage 权限
      parameters:
      - description: 按分类过滤
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 权限目录（resource:action）
      tags:
      - admin-roles
  /admin/roles:
    get:
      description: 返回全部角色（内置优先）；需要 roles:manage 权限（admin 自动放行）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 角色列表
      tags:
      - admin-roles
    post:
      consumes:
      - application/json
      description: 新建自定义角色并绑定权限（内置 admin code 保留）；需要 roles:manage 权限
      parameters:
      - description: 角色定义
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建角色
      tags:
      - admin-roles
  /admin/roles/{code}:
    delete:
      description: 删除自定义角色并清理权限关联；内置角色或仍被用户引用时拒绝；需要 roles:manage 权限
      parameters:
      - description: 角色 code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除角色
      tags:
      - admin-roles
    get:
      description: 按 code（或兼容 :id 形式）返回单个角色及其权限
      parameters:
      - description: 角色 code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 角色详情
      tags:
      - admin-roles
    put:
      consumes:
      - application/json
      description: 自定义角色可改名称/描述，权限可更新（admin 角色保持通配不变）；需要 roles:manage 权限
      parameters:
      - description: 角色 code
        in: path
        name: code
        required: true
        type: string
      - description: 角色更新
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新角色
      tags:
      - admin-roles
  /admin/users:
    get:
      description: 返回不含密码字段的安全用户信息；需要 users:manage 权限
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: size
        type: integer
      - description: 角色过滤
        in: query
        name: role
        type: string
      - description: 关键字
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 用户列表（分页/过滤）
      tags:
      - admin-users
    post:
      consumes:
      - application/json
      description: 校验用户名格式/密码强度/角色存在性后创建；需要 users:manage 权限
      parameters:
      - description: 用户创建
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - admin-users
  /admin/users/{id}:
    delete:
      description: 禁止删除自身与内置 admin 账户；需要 users:manage 权限
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - admin-users
    get:
      description: 返回不含密码字段的安全用户信息；需要 users:manage 权限
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
