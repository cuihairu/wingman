basePath: /api
definitions:
  handlers.ScreenshotRequest:
    properties:
      height:
        type: integer
      image:
        type: string
      timestamp:
        type: integer
      width:
        type: integer
    type: object
host: localhost:9527
info:
  contact: {}
  description: |-
    Wingman 远程中控编排器 HTTP API（auth / RBAC / agent / script / workflow / messages / settings）。
    架构约束：Dashboard 与远程客户端只连接本 server，不直连 runtime。
  title: Wingman Orchestrator API
  version: "1.0"
paths:
  /admin/permissions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 权限目录（resource:action）
      tags:
      - admin-roles
  /admin/roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 角色列表
      tags:
      - admin-roles
    post:
      consumes:
      - application/json
      description: 新建自定义角色并绑定权限（内置 admin code 保留）；需要 roles:manage 权限
      parameters:
      - description: 角色定义
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建角色
      tags:
      - admin-roles
  /admin/roles/{code}:
    delete:
      description: 删除自定义角色并清理权限关联；内置角色或仍被用户引用时拒绝；需要 roles:manage 权限
      parameters:
      - description: 角色 code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除角色
      tags:
      - admin-roles
    get:
      description: 按 code（或兼容 :id 形式）返回单个角色及其权限
      parameters:
      - description: 角色 code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 角色详情
      tags:
      - admin-roles
    put:
      consumes:
      - application/json
      description: 自定义角色可改名称/描述，权限可更新（admin 角色保持通配不变）；需要 roles:manage 权限
      parameters:
      - description: 角色 code
        in: path
        name: code
        required: true
        type: string
      - description: 角色更新
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新角色
      tags:
      - admin-roles
  /admin/users:
    get:
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: size
        type: integer
      - description: 角色过滤
        in: query
        name: role
        type: string
      - description: 关键字
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 用户列表（分页/过滤）
      tags:
      - admin-users
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户创建
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - admin-users
  /admin/users/{id}:
    delete:
      description: 禁止删除自身与内置 admin 账户；需要 users:manage 权限
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - admin-users
    get:
      description: 返回不含密码字段的安全用户信息；需要 users:manage 权限
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 用户详情
      tags:
      - admin-users
    put:
      consumes:
      - application/json
      description: 更新角色/启用状态，不改密码；需要 users:manage 权限
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新字段
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新用户
      tags:
      - admin-users
  /admin/users/{id}/reset-password:
    post:
      consumes:
      - application/json
      description: 管理员重置任意用户密码（校验强度）；需要 users:manage 权限
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新密码
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 重置用户密码
      tags:
      - admin-users
  /agents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Agent 列表（状态/标签/负载）
      tags:
      - agents
  /agents/{agentId}:
    get:
      description: 返回单个 agent 的状态/标签/负载信息
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Agent 详情
      tags:
      - agents
  /agents/{agentId}/shutdown:
    post:
      description: 下发 system.shutdown 并将 agent 标记为 offline；需要 agents:manage 权限
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 关闭 Agent
      tags:
      - agents
  /agents/{agentId}/tags:
    put:
      consumes:
      - application/json
      description: 覆盖式更新 agent 标签；需要 agents:manage 权限
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      - description: 标签列表
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 设置 Agent 标签
      tags:
      - agents
  /agents/{agentId}/triggers:
    get:
      description: 经 agent 通道读取 runtime TriggerManager 的 trigger.list
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Agent 触发器列表
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: 经 agent 通道下发 trigger.add（Dispatcher Reuse，配置透传 runtime TriggerManager）；需要
        agents:manage 权限
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      - description: 触发器配置
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 新增 Agent 触发器
      tags:
      - agents
  /agents/{agentId}/triggers/{triggerId}:
    delete:
      description: 经 agent 通道下发 trigger.remove；需要 agents:manage 权限
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      - description: 触发器 ID（数字）
        in: path
        name: triggerId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除 Agent 触发器
      tags:
      - agents
    put:
      consumes:
      - application/json
      description: 经 agent 通道下发 trigger.update（部分字段更新，缺省保持原值）；需要 agents:manage 权限
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      - description: 触发器 ID（数字）
        in: path
        name: triggerId
        required: true
        type: string
      - description: 触发器配置（部分字段）
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新 Agent 触发器
      tags:
      - agents
  /agents/{agentId}/triggers/toggle:
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent ID
        in: path
        name: agentId
        required: true
        type: string
      - description: 触发器 ID
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 切换 Agent 触发器启用状态
      tags:
      - agents
  /audit:
    get:
      description: 分页查询审计日志，支持按操作者/事件类型/时间范围过滤
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数（最大 200）
        in: query
        name: size
        type: integer
      - description: 操作者过滤
        in: query
        name: actor
        type: string
      - description: 事件类型（CSV，如 user.create,login）
        in: query
        name: kinds
        type: string
      - description: 起始时间（RFC3339）
        in: query
        name: start
        type: string
      - description: 结束时间（RFC3339）
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 审计事件列表
      tags:
      - audit
  /debugger/breakpoints:
    get:
      description: 断点由 VSCode 直连 runtime 管理，固定返回 501 与直连指引
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取断点（直连模式）
      tags:
      - debugger
    post:
      description: 断点由 VSCode 直连 runtime 管理，固定返回 501 与直连指引
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 设置断点（直连模式）
      tags:
      - debugger
  /debugger/command:
    post:
      description: 调试协议不经 server 中转，固定返回 501 与直连指引
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 调试命令（直连模式）
      tags:
      - debugger
  /debugger/connect:
    post:
      description: 调试协议不经 server 中转，固定返回 501 与直连指引
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 调试器连接（直连模式）
      tags:
      - debugger
  /debugger/info:
    get:
      description: EmmyLua 调试由 VSCode 直连 runtime 调试端口（默认 9966），server 不中转；返回各 agent
        调试端点与 launch.json 片段
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 调试器信息（直连模式）
      tags:
      - debugger
  /feedback:
    post:
      consumes:
      - application/json
      description: 写入反馈记录，并向提交者与管理员（广播）生成站内消息
      parameters:
      - description: 反馈内容
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 提交反馈/权限申请
      tags:
      - feedback
  /messages:
    get:
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数（最大 100）
        in: query
        name: pageSize
        type: integer
      - description: read|unread|all
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出站内消息（per-user 已读状态）
      tags:
      - messages
  /messages/{id}/read:
    post:
      description: 为当前用户幂等写入 message_reads 记录（广播消息按用户隔离）
      parameters:
      - description: 消息 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 标记消息已读
      tags:
      - messages
  /messages/read-all:
    post:
      description: 将当前用户所有可见的未读消息写入已读记录
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 全部标记已读
      tags:
      - messages
  /messages/unread-count:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 未读消息数（per-user）
      tags:
      - messages
  /scripts:
    delete:
      consumes:
      - application/json
      description: 删除脚本文件与 DB 记录（DELETE /scripts 与 POST /scripts/delete 两个入口）；需要 scripts:edit
        权限
      parameters:
      - description: 脚本路径
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除脚本
      tags:
      - scripts
    get:
      description: 返回已登记的脚本（同时在 /api/v1/scripts 注册）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 脚本列表
      tags:
      - scripts
    post:
      consumes:
      - application/json
      description: 生成 Lua 模板文件并写入 DB 记录（路径穿越防护）；需要 scripts:edit 权限
      parameters:
      - description: 脚本元信息
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建脚本
      tags:
      - scripts
  /scripts/content:
    post:
      consumes:
      - application/json
      description: 按路径返回脚本全文（路径经 store 安全校验）
      parameters:
      - description: 脚本路径
        in: body
        name: request
        required: true
        schema:
