# Guacamole e2e 链路测试的本地容器栈（仅测试用，勿用于生产）。
#
#   scripts/verify-guacd-e2e.sh up      # 拉起 + 等就绪
#   scripts/verify-guacd-e2e.sh test    # 跑三协议链路用例
#   scripts/verify-guacd-e2e.sh down    # 拆栈
#
# 全部 network_mode: host：guacd(4822) / sshd(2222) / vnc(5901) / xrdp(3389)
# 直接监听宿主回环，agent 注册表以 127.0.0.1 作为目标 IP。
#
# 镜像策略（供应链治理）：guacd 仍为运行时拉取的官方镜像，**钉 digest**（不只
# 是 tag）——三条目标端点上游曾用 `latest`，任何一次重建都会静默换掉镜像内容，
# e2e 会在无人改代码的情况下变红。sshd/vnc/xrdp 三个目标端点已改为**仓内
# Dockerfile 自建**（Dockerfile.sshd/.vnc/.xrdp，替代 linuxserver/accetto/
# danielguerra 三个第三方镜像）：其外部依赖收敛到 Dockerfile 的 FROM，
# 均固定官方基础镜像 tag + digest，同样满足「镜像变了必须显式、可评审」。
# guacd digest 更新方式不变：改 tag → 跑 `docker manifest inspect -v <image>`
# 取 Descriptor.digest（多架构取 index digest）→ 一并改这里。
services:
  guacd:
    # 锁定 1.5.5：官方 1.6.0（含 2026-02 latest 重建）RDP 双崩溃——
    # guac_audio_assign_encoder 空指针（编码器未链接）与 guac_user_supports_webp
    # 空指针（display 重构竞态），均无客户端侧规避参数；网关已对 1.5.5 显式
    # disable-audio 规避其音频路径崩溃（见 handlers/guacamole.go guacParamTable）。
    # digest 2026-09-25 实测取得。
    image: guacamole/guacd:1.5.5@sha256:38232cae271361ef53db46faf5c49fe64049a1320a05b82c597425b69d6ce77e
    container_name: wg-e2e-guacd
    network_mode: host
    environment:
      GUACD_LOG_LEVEL: info
    healthcheck:
      # guacd 无 HTTP 面，唯一探针是「4822 端口可连」。用 bash 内建 /dev/tcp
      # ——镜像内无 curl/nc，不能依赖它们。
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/4822' || exit 1"]
      interval: 3s
      timeout: 3s
      # 启动探测给足余量：guacd 起来即可连，但冷启动要拉解压层
      retries: 20
      start_period: 5s

  sshd:
    # 自建镜像：debian:bookworm-slim + openssh-server（供应链治理，替代
    # lscr.io/linuxserver/openssh-server；基础镜像钉官方 digest，见 Dockerfile.sshd）。
    # 凭据 test/test 固化在镜像内；首次 up 会触发仓内构建。
    build:
      context: .
      dockerfile: Dockerfile.sshd
    image: wingman-e2e-sshd:latest
    container_name: wg-e2e-sshd
    network_mode: host
    environment:
      # 固定 locale/timezone：时区会进登录 shell 的 motd 与时区数据，
      # 跨时区跑出来的输出不可比
      TZ: Asia/Shanghai
    healthcheck:
      # 自建镜像的 sshd_config.d/e2e.conf 已固定 Port 2222（避开宿主 22），
      # 故探 2222。
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/2222' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  vnc:
    # 自建镜像：ubuntu 24.04 官方基础镜像 + TigerVNC + xfce（供应链治理，替代
    # accetto/ubuntu-vnc-xfce-g3；基础镜像钉官方 digest，见 Dockerfile.vnc）。
    # 用例断言首帧 drawing，需真实桌面，故不能精简成空壳端口。
    build:
      context: .
      dockerfile: Dockerfile.vnc
    image: wingman-e2e-vnc:latest
    container_name: wg-e2e-vnc
    network_mode: host
    environment:
      VNC_PW: headless
    healthcheck:
      # ubuntu 官方基础镜像自带 bash，探针沿用 /dev/tcp（不引入 curl/nc 依赖）
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/5901' || exit 1"]
      interval: 5s
      timeout: 4s
      # VNC + xfce 首启要建 session，实测比 sshd 慢不少
      retries: 30
      start_period: 10s

  xrdp:
    # 自建镜像：ubuntu 24.04 官方基础镜像 + xrdp/xorgxrdp + xfce（供应链治理，
    # 替代 danielguerra/ubuntu-xrdp；基础镜像钉官方 digest，见 Dockerfile.xrdp）。
    build:
      context: .
      dockerfile: Dockerfile.xrdp
    image: wingman-e2e-xrdp:latest
    container_name: wg-e2e-xrdp
    network_mode: host
    healthcheck:
      # xrdp 监听 3389。探针只能判「端口在」，不能判「X session 起好」——
      # 后者要等首帧，交给 e2e 用例自己的 40s 窗口。
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/3389' || exit 1"]
      interval: 5s
      timeout: 4s
      # xrdp 首次会话建立最慢（X session 冷启），给足重试
      retries: 30
      start_period: 10s
